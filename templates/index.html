<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Sampit</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .kotak { max-width: 450px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .pesan-salam { margin-top: 15px; color: #1a5276; font-weight: bold; }
        .navigasi { margin-top: 20px; font-size: 0.9em; }
        a { color: #1a5276; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="kotak">
        <!-- Judul halaman -->
        <h1>Halo Sampit!</h1>
        
        <!-- Menampilkan salam sebelum waktu server -->
        <p>{{ salam }}. <strong>Waktu Server:</strong> {{ waktu_server }}</p>

        <!-- Formulir pengiriman nama tanpa JavaScript -->
        <form method="POST" action="/">
            <label for="nama">Masukkan Nama:</label><br><br>
            <input type="text" id="nama" name="nama" required maxlength="50" placeholder="Contoh: Muhammad Rapianur">
            <button type="submit">Kirim</button>
        </form>

        <!-- Menampilkan salam jika formulir sudah dikirim -->
        <!-- Jinja2 otomatis melakukan auto-escape sehingga aman dari serangan XSS -->
        {% if nama %}
            <p class="pesan-salam">Halo, {{ nama }}!</p>
        {% endif %}

        <div class="navigasi">
            <hr>
            <a href="/tentang">Lihat Halaman Tentang →</a>
        </div>
    </div>
</body>
</html>
